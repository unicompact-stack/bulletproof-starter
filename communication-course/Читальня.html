div>\n<div class=\"edge\">\n<span class=\"box\">Есть ли приёму опора вне НЛП?</span>\n<span class=\"arrow\">—<span class=\"lab\">Да: переформулирование в КПТ</span>→</span>\n<span class=\"box\">Брать, но ссылаться на КПТ</span>\n</div>\n<div class=\"edge\">\n<span class=\"box\">Есть ли приёму опора вне НЛП?</span>\n<span class=\"arrow\">—<span class=\"lab\">Нет</span>→</span>\n<span class=\"box\">Только как личный опыт автора</span>\n</div>\n</div>\n<h2>Что делать</h2>\n<ol><li><strong>Пользоваться приёмами можно, выдавать их за науку — нет.</strong> Разница</li></ol>\n<p>в одной фразе: «есть такой речевой ход» вместо «доказано, что».</p>\n<ol><li><strong>Забыть про визуалов и аудиалов.</strong> Самая растиражированная идея и</li></ol>\n<p>самая прямо опровергнутая (S-074).</p>\n<ol><li><strong>Не читать мысли по глазам.</strong> Схема не работает (S-077), а вера в</li></ol>\n<p>неё ведёт к ложным выводам о собеседнике.</p>\n<ol><li><strong>Переформулирование брать — но у КПТ.</strong> Там тот же приём с реальной</li></ol>\n<p>доказательной базой.</p>\n<ol><li><strong>Для структуры речи брать Минто, а не Дилтса</strong> (S-079 в реестре):</li></ol>\n<p>главная мысль первой, аргументы под ней.</p>\n<ol><li><strong>Настораживаться на обещания.</strong> Если курс обещает «управление</li></ol>\n<p>собеседником», посмотрите, на что он ссылается. Сорок лет попыток подтвердить не дали результата (S-076).</p>\n<h2>Противоречия и пробелы</h2>\n<ul><li><strong>Положительные результаты существуют.</strong> 18,2 % работ в обзоре</li></ul>\n<p>Витковского эффективность подтверждают (S-073), голландское исследование 2016 года дало улучшение у части участников. Но выборки там крошечные, а короткое заинтересованное вмешательство улучшает самочувствие и за счёт внимания и ожиданий.</p>\n<ul><li><strong>«Не доказано» не равно «вредно».</strong> Ни один источник не показывает,</li></ul>\n<p>что приёмы вредят. Вопрос в том, что обещания не обеспечены.</p>\n<ul><li><strong>Обзоры мерили не то, что нам нужно.</strong> S-028 — про показатели</li></ul>\n<p>здоровья, S-076 — про организации. <strong>Исследований НЛП именно в бытовом общении я не нашёл.</strong> Это честный пробел: строго говоря, в нашей области метод не столько опровергнут, сколько не проверялся.</p>\n<ul><li><strong>Часть источников проверена не до конца.</strong> 07.11.2026 библиографию</li></ul>\n<p>S-073 и S-077 подтвердил по DOI, они переведены в «проверено»; S-077 доступен полным текстом. Но S-074, S-075 и S-076 по-прежнему «на проверке»: выходные данные не сверены, выводы собраны по рефератам.</p>\n<ul><li><strong>Расхождение в пересказах S-073.</strong> Одни источники пишут про 63</li></ul>\n<p>отобранные работы из 315 найденных, другие — про 33. Доли совпадают везде. В тексте выше указано 63.</p>\n<ul><li><strong>Не разобрано:</strong> что из фокусов языка совпадает с приёмами</li></ul>\n<p>когнитивной реструктуризации один в один. Такое сопоставление было бы полезнее, чем спор о статусе НЛП.</p>\n<h2>Источники</h2>\n<table><thead><tr><th>Код</th><th>Источник</th><th>Что взято</th></tr></thead><tbody><tr><td>S-028</td><td>Стёрт и др., 2012, BJGP</td><td>систематический обзор: мало доказательств</td></tr><tr><td>S-073</td><td>Витковски, 2010</td><td>63 работы: 54,5 % опровергают</td></tr><tr><td>S-074</td><td>Шарпли, 1987</td><td>ведущая репрезентативная система не найдена</td></tr><tr><td>S-075</td><td>Дракман и Свитс, 1988, NRC США</td><td>государственная комиссия: подтверждений нет</td></tr><tr><td>S-076</td><td>Котера и др., 2019</td><td>обзор по организациям: база слабая</td></tr><tr><td>S-077</td><td>Уайзман и др., 2012</td><td>глазные сигналы лжи не работают</td></tr><tr><td>S-078</td><td>Дилтс, 1999</td><td>источник самих приёмов, каталог речевых ходов</td></tr><tr><td>S-079</td><td>Минто, 1987</td><td>структура речи вне НЛП: главная мысль первой</td></tr></tbody></table>\n<h2>История правок</h2>\n<table><thead><tr><th>Дата</th><th>Что изменилось</th><th>Почему</th></tr></thead><tbody><tr><td>2026-11-07</td><td>Статья создана</td><td>нужна опора для честной оговорки про НЛП во всех материалах</td></tr><tr><td>2026-11-07</td><td>S-073 и S-077 переведены в «проверено»</td><td>подтверждены DOI; добавлено расхождение в пересказах S-073</td></tr></tbody></table>", "text": " ## вопрос нлп обещает управлять разговором через язык: переформулировать убеждение, подстроиться под собеседника, считать мысли по глазам. книги продаются сорок лет. что из этого подтверждено? ## короткий ответ как теория — ничего. нлп признано псевдонаукой: проверяемые утверждения проверили и опровергли, непроверяемые так и остались непроверяемыми. систематический обзор в british journal of general practice нашёл «мало доказательств» пользы (s-028); из 63 отобранных исследований больше половины метод опровергают (s-073); комиссия национального исследовательского совета сша не нашла подтверждений ещё в 1988-м (s-075), а обзор 2019 года повторил тот же вывод (s-076). при этом **отдельные приёмы работают — но не потому, что это нлп.** переформулирование помогает, и это известно из когнитивно-поведенческой терапии. заслугу стоит отдать ей. ## что известно ### что именно проверяли и что нашли | утверждение нлп | статус | |---|---| | у человека есть ведущий канал: визуал, аудиал, кинестетик | не подтверждено (s-074) | | подстройка под «его слова» улучшает контакт | не подтверждено (s-074) | | направление взгляда выдаёт тип мысли или ложь | опровергнуто (s-077) | | «якорение» — особый механизм | переименование обычного обусловливания | | нлп улучшает результаты в обучении и переговорах | не подтверждено (s-076) | самая известная идея — деление на визуалов и аудиалов — проверялась раньше всех, потому что её легко проверить. устойчивого ведущего канала не нашли, а подстройка под предикаты собеседника пользы не дала (s-074). про глаза ещё нагляднее. уайзман с коллегами разобрал три исследования, включая записи настоящих пресс-конференций, где человеку было что скрывать. движения глаз не совпали со схемой нлп вообще (s-077). ### почему спор не кончается сторонники отвечают, что исследования проводили неподготовленные люди в искусственных условиях. возражение не пустое, но у него есть оборотная сторона, которую отметил ещё шарпли: теория, которую могут проверить только её же сертифицированные практики и у которой любая неудача объясняется недостатком мастерства, перестаёт быть опровержимой (s-074). это и есть главная претензия. не «одно исследование не удалось», а отсутствие поддержки на всех уровнях сразу: государственная комиссия, аудит базы публикаций, систематические обзоры по здоровью и по организациям. ### что тогда делать с техниками книга дилтса описывает четырнадцать способов переформулировать убеждение: сменить масштаб, указать на намерение, перевести в аналогию, поднять на уровень ценности (s-078). как каталог речевых ходов это полезно — примерно как сборник риторических фигур. важно только понимать происхождение: это наблюдения автора за чужой риторикой, а не результат эксперимента. мы держим такие источники в библиотеке с низкой оценкой (6 из 14) и пометкой, что доказательность отсутствует. отдельно стоит развести два похожих слова. «пирамида» у дилтса — это логические уровни из нлп. «принцип пирамиды» барбары минто — методика структурирования аргументации из mckinsey, к нлп отношения не имеющая. совпадает только слово. ## схема ```mermaid flowchart td a[приём из нлп] --> b{утверждение можно проверить?} b -->|да| c[проверили: не подтвердилось] b -->|нет| d[непроверяемо, неудачу спишут на ученика] c --> e[не ссылаться как на доказанное] d --> e a --> f{есть ли приёму опора вне нлп?} f -->|да: переформулирование в кпт| g[брать, но ссылаться на кпт] f -->|нет| h[только как личный опыт автора] ``` ## что делать 1. **пользоваться приёмами можно, выдавать их за науку — нет.** разница в одной фразе: «есть такой речевой ход» вместо «доказано, что». 2. **забыть про визуалов и аудиалов.** самая растиражированная идея и самая прямо опровергнутая (s-074). 3. **не читать мысли по глазам.** схема не работает (s-077), а вера в неё ведёт к ложным выводам о собеседнике. 4. **переформулирование брать — но у кпт.** там тот же приём с реальной доказательной базой. 5. **для структуры речи брать минто, а не дилтса** (s-079 в реестре): главная мысль первой, аргументы под ней. 6. **настораживаться на обещания.** если курс обещает «управление собеседником», посмотрите, на что он ссылается. сорок лет попыток подтвердить не дали результата (s-076). ## противоречия и пробелы - **положительные результаты существуют.** 18,2 % работ в обзоре витковского эффективность подтверждают (s-073), голландское исследование 2016 года дало улучшение у части участников. но выборки там крошечные, а короткое заинтересованное вмешательство улучшает самочувствие и за счёт внимания и ожиданий. - **«не доказано» не равно «вредно».** ни один источник не показывает, что приёмы вредят. вопрос в том, что обещания не обеспечены. - **обзоры мерили не то, что нам нужно.** s-028 — про показатели здоровья, s-076 — про организации. **исследований нлп именно в бытовом общении я не нашёл.** это честный пробел: строго говоря, в нашей области метод не столько опровергнут, сколько не проверялся. - **часть источников проверена не до конца.** 07.11.2026 библиографию s-073 и s-077 подтвердил по doi, они переведены в «проверено»; s-077 доступен полным текстом. но s-074, s-075 и s-076 по-прежнему «на проверке»: выходные данные не сверены, выводы собраны по рефератам. - **расхождение в пересказах s-073.** одни источники пишут про 63 отобранные работы из 315 найденных, другие — про 33. доли совпадают везде. в тексте выше указано 63. - **не разобрано:** что из фокусов языка совпадает с приёмами когнитивной реструктуризации один в один. такое сопоставление было бы полезнее, чем спор о статусе нлп. ## источники | код | источник | что взято | |---|---|---| | s-028 | стёрт и др., 2012, bjgp | систематический обзор: мало доказательств | | s-073 | витковски, 2010 | 63 работы: 54,5 % опровергают | | s-074 | шарпли, 1987 | ведущая репрезентативная система не найдена | | s-075 | дракман и свитс, 1988, nrc сша | государственная комиссия: подтверждений нет | | s-076 | котера и др., 2019 | обзор по организациям: база слабая | | s-077 | уайзман и др., 2012 | глазные сигналы лжи не работают | | s-078 | дилтс, 1999 | источник самих приёмов, каталог речевых ходов | | s-079 | минто, 1987 | структура речи вне нлп: главная мысль первой | ## история правок | дата | что изменилось | почему | |---|---|---| | 2026-11-07 | статья создана | нужна опора для честной оговорки про нлп во всех материалах | | 2026-11-07 | s-073 и s-077 переведены в «проверено» | подтверждены doi; добавлено расхождение в пересказах s-073 | "}], "topics": [{"id": "T-01", "title": "Психология общения и тревога", "desc": "Что происходит с человеком до и во время разговора: страх оценки, внимание на себе, «пустая голова», физиология волнения."}, {"id": "T-02", "title": "Разговор: начало, поддержание, выход", "desc": "Small talk, открытые вопросы, темы, переход от светской беседы к содержательной, корректное завершение разговора."}, {"id": "T-03", "title": "Быстрый ответ и структура речи", "desc": "Как собрать мысль за секунды: схемы ответа, речевые заготовки, работа с паузой, краткость."}, {"id": "T-04", "title": "Импровизация", "desc": "Принцип «да, и», работа с партнёром, спонтанность, статус, игры импровизационных школ."}, {"id": "T-05", "title": "Сторителлинг", "desc": "Как устроена история: конфликт, структура, деталь, длина. Бытовой рассказ, а не сценарий фильма."}, {"id": "T-06", "title": "Юмор", "desc": "Механика смешного: слом ожидания, правило трёх, формула шутки, уместность."}, {"id": "T-07", "title": "Публичные выступления и риторика", "desc": "Подготовка речи, структура выступления, работа с аудиторией, классическая риторика. Сюда же — тосты и застольные речи."}, {"id": "T-08", "title": "Актёрское мастерство", "desc": "Система Станиславского и смежные школ ": "10/14", "status": "проверено", "lessons": "2"}, {"id": "S-090", "title": "Говори красиво и уверенно. Постановка голоса и речи", "author": "Шестакова Е. С.", "year": "2024", "kind": "практическое руководство", "link": "—", "access": "печатное издание", "score": "9/14", "status": "на проверке", "lessons": "2"}], "notes": {"S-001": "<ul><li><strong>Оригинальное название:</strong> Wandering Minds: The Default Network and Stimulus-Independent Thought</li><li><strong>Автор:</strong> Мейсон М. и др.</li><li><strong>Год:</strong> 2007</li><li><strong>Тип:</strong> исследование</li><li><strong>Ссылка:</strong> https://doi.org/10.1126/science.1131295</li><li><strong>Доступ:</strong> реферат</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 1</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Сеть пассивного режима мозга активна, когда человек не занят внешней задачей.</li><li>Блуждание мыслей — базовый режим работы мозга, а не сбой.</li><li>Опытные испытуемые чаще уходят в мысли на хорошо освоенных задачах.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Урок 1: аргумент «пустая голова — не дефект личности».</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr><td>Дата</td><td>2</td></tr><tr><td>Тип</td><td>2</td></tr><tr><td>Доказательность</td><td>2</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>13/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Небольшая выборка, фМРТ-исследование 2007 года; интерпретации DMN с тех пор уточнялись.</li></ul>", "S-002": "<ul><li><strong>Оригинальное название:</strong> A Wandering Mind Is an Unhappy Mind</li><li><strong>Автор:</strong> Киллингсворт М., Гилберт Д.</li><li><strong>Год:</strong> 2010</li><li><strong>Тип:</strong> исследование</li><li><strong>Ссылк г начала XX века; данных об эффективности нет.</li><li>Текст в общественном достоянии в США.</li></ul>", "S-058": "<ul><li><strong>Оригинальное название:</strong> The &quot;Art&quot; of Rhetoric</li><li><strong>Автор:</strong> Аристотель</li><li><strong>Год:</strong> 1926</li><li><strong>Тип:</strong> классический трактат</li><li><strong>Ссылка:</strong> https://archive.org/details/artofrhetoric00arisuoft</li><li><strong>Доступ:</strong> полный текст</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 2, 6</li><li><strong>Тема:</strong> T-07</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Убеждение опирается на три основания: характер говорящего, состояние слушателя и сам довод.</li><li>Речь строится под конкретную аудиторию и ситуацию, а не «вообще».</li><li>Риторика описана как ремесло с правилами, а не как талант.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Урок 2: опора на факт как основание довода.</li><li>T-07: базовая рамка для всех руководств по выступлениям.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr><td>Дата</td><td>2</td></tr><tr><td>Тип</td><td>1</td></tr><tr><td>Доказательность</td><td>1</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>11/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Издание 1926 года (Loeb, перевод Freese) — перевод может иметь собственный статус охраны в отдельных странах.</li><li>Античный контекст: часть примеров и норм неприменима напрямую.</li><li>Первоисточник, но вторичные пересказы его часто искажают — читать в оригинале перевода.</li></ul>", "S-059": "<ul><li><strong>Автор:</strong> Станиславский К. С.</li><li><strong>Год:</strong> 1951</li><li><strong>Тип:</strong> монография</li><li><strong>Ссылка:</strong> https://rusneb.ru/catalog/000199_000009_003815785/</li><li><strong>Доступ:</strong> скан НЭБ, полный текст</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 1, 5</li><li><strong>Тема:</strong> T-08</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Сценическое внимание тренируется: это навык, а не состояние вдохновения.</li><li>«Публичное одиночество» — способность работать на глазах у зрителей, не обслуживая их взгляд.</li><li>Мышечный зажим мешает и движению, и мысли; расслабление — отдельное упражнение.</li><li>Актёр действует, а не изображает чувство: эмоция приходит из действия.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Урок 1: зажим и внимание как причина «пустой головы».</li><li>Урок 5: действие вместо попытки «быть интересным».</li><li>T-08: базовый источник темы, вокруг него будет строиться рубрика.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr><td>Дата</td><td>2</td></tr><tr><td>Тип</td><td>2</td></tr><tr><td>Доказательность</td><td>1</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>12/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Автор умер в 1938 году — срок охраны самого текста истёк.</li><li>Издание 1951 года содержит редакторский аппарат и комментарии составителей, у которых может быть свой срок охраны: цитируем только текст Станиславского.</li><li>Театральная педагогика, а не эмпирика: переносимость приёмов в бытовое общение не проверялась.</li></ul>", "S-060": "<ul><li><strong>Оригинальное название:</strong> The use of improvisational theater training to reduce social anxiety in adolescents</li><li><strong>Автор:</strong> Фелсман П., Зайферт К., Химл Дж.</li><li><strong>Год:</strong> 2019</li><li><strong>Тип:</strong> исследование</li><li><strong>Ссылка:</strong> https://doi.org/10.1016/j.aip.2018.12.001</li><li><strong>Доступ:</strong> реферат</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 5</li><li><strong>Тема:</strong> T-04</li></ul>\n<h2>Что говорит</h2>\n<ul><li>После курса импровизационного театра 43 % подростков, у которых был положительный скрининг на социальную фобию, перестали его проходить.</li><li>Размер эффекта большой (d ≈ 0,95).</li><li>Снижение тревоги связано с ростом социальных навыков, надежды и готовности ошибаться.</li><li>Чем выше вовлечённость, тем сильнее эффект.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Урок 5 и тема T-04: первое прямое подтверждение, что импровизация снижает тревогу общения.</li><li>Статья A-001: закрывает пробел «нет исследований по театральным приёмам».</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr><td>Дата</td><td>2</td></tr><tr><td>Тип</td><td>2</td></tr><tr><td>Доказательность</td><td>2</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>13/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Выборка 266 школьников, но отсев 45,5 % — это много и смещает результат.</li><li>Дизайн без контрольной группы, замеры до/после.</li><li>Подростки, а не взрослые: переносимость на взрослого человека не проверена.</li></ul>", "S-061": "<ul><li><strong>Оригинальное название:</strong> Improv Experience Promotes Divergent Thinking, Uncertainty Tolerance, and Affective Well-Being</li><li><strong>Автор:</strong> Фелсман П. и др.</li><li><strong>Год:</strong> 2020</li><li><strong>Тип:</strong> исследование</li><li><strong>Ссылка:</strong> https://doi.org/10.1016/j.tsc.2020.100632</li><li><strong>Доступ:</strong> реферат</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 5</li><li><strong>Тема:</strong> T-04</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Двадцати минут импровизационных упражнений достаточно, чтобы вырос показатель дивергентного мышления.</li><li>Растёт терпимость к неопределённости — способность действовать, не зная, чем кончится.</li><li>Эксперимент с контрольной группой, два исследования (n = 74 и n = 131).</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-04: обоснование упражнения «20 минут одной техники».</li><li>Урок 5: почему короткая разминка работает.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr><td>Дата</td><td>2</td></tr><tr><td>Тип</td><td>2</td></tr><tr><td>Доказательность</td><td>1</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>12/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Эффект измерен сразу после занятия: сохраняется ли он — неизвестно.</li><li>Дивергентное мышление в лаборатории не равно находчивости в разговоре.</li></ul>", "S-062": "<ul><li><strong>Оригинальное название:</strong> Improv to Improve: The Impact of Improvisational Theater on Creativity, Acceptance, and Psychological Well-Being</li><li><strong>Автор:</strong> Швенке Д. и др.</li><li><strong>Год:</strong> 2021</li><li><strong>Тип:</strong> исследование</li><li><strong>Ссылка:</strong> https://www.researchgate.net/publication/340843426</li><li><strong>Доступ:</strong> реферат</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 5</li><li><strong>Тема:</strong> T-04</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Шестинедельный курс импровизации повысил креативность и психологическое благополучие.</li><li>Выросли самооценка и самоэффективность.</li><li>Гипотеза о росте «принятия» не подтвердилась.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-04: честная картина — работает не  нет контрольной группы.</li><li>Полный текст недоступен, выходные данные взяты из списка цитирований — требуется проверка.</li></ul>", "S-064": "<ul><li><strong>Оригинальное название:</strong> Reducing social anxiety and intolerance of uncertainty in adolescents with improvisational theater</li><li><strong>Автор:</strong> Фелсман П. и др.</li><li><strong>Год:</strong> 2023</li><li><strong>Тип:</strong> исследование</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> реферат</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 5</li><li><strong>Тема:</strong> T-04</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Повторное исследование той же группы авторов подтверждает снижение социальной тревоги.</li><li>Добавлен механизм: падает непереносимость неопределённости.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-04: воспроизведение результата S-060 — это важно.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr><td>Дата</td><td>1</td></tr><tr><td>Тип</td><td>1</td></tr><tr><td>Доказательность</td><td>1</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>10/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Выходные данные взяты из списка цитирований статьи 2019 года, DOI не проверен.</li><li>Та же исследовательская группа — независимого воспроизведения пока нет.</li></ul>", "S-065": "<ul><li><strong>Оригинальное название:</strong> The Psychology of Humor: An Integrative Approach</li><li><strong>Автор:</strong> Мартин Р., Форд Т.</li><li><strong>Год:</strong> 2018</li><li><strong>Тип:</strong> монография</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 6</li><li><strong>Тема:</strong> T-06</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Три классические теории смешного: несообразность, превосходство, разрядка.</li><li>Ни одна из них по отдельности не объясняет все случаи юмора.</li><li>Юмор описывается как социальное поведение, а не только как свойство текста.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-06: базовая рамка для всех статей о юморе.</li><li>Урок 6: объяснение, почему шутка не работает в отрыве от ситуации.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr><td>Дата</td><td>2</td></tr><tr><td>Тип</td><td>2</td></tr><tr><td>Доказательность</td><td>1</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>12/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Учебник: пересказывает чужие исследования, первоисточники нужно смотреть отдельно.</li></ul>", "S-066": "<ul><li><strong>Оригинальное название:</strong> The Incongruity of Incongruity Theories of Humor</li><li><strong>Автор:</strong> Кулка Т.</li><li><strong>Год:</strong> 2007</li><li><strong>Тип:</strong> статья</li><li><strong>Ссылка:</strong> https://www.semanticscholar.org/paper/80842ada51c14f311a7ec7ade9ae0db470ee80b5</li><li><strong>Доступ:</strong> реферат</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 6</li><li><strong>Тема:</strong> T-06</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Одного несоответствия мало: смешно становится от его разрешения.</li><li>Несообразность сама по себе может вызывать тревогу или отвращение, а не смех.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Урок 6: почему панчлайн должен разрешать ожидание, а не просто ломать его.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr heory of humor</li><li><strong>Автор:</strong> Хадзитомас Л. и др.</li><li><strong>Год:</strong> 2024</li><li><strong>Тип:</strong> исследование</li><li><strong>Ссылка:</strong> https://doi.org/10.3389/fpsyg.2024.1473742</li><li><strong>Доступ:</strong> полный текст</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 6</li><li><strong>Тема:</strong> T-06</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Ни несообразность, ни «благожелательное нарушение» не отделяют удачные шутки от неудачных.</li><li>Предложена альтернатива: смешно, когда есть игровой поворот и совпадение с мотивом слушателя.</li><li>Веселье описано как отдельная короткая положительная эмоция.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-06: прямое возражение источнику S-025, идёт в раздел «Противоречия».</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>2</td></tr><tr><td>Дата</td><td>2</td></tr><tr><td>Тип</td><td>1</td></tr><tr><td>Доказательность</td><td>1</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>11/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Два онлайн-эксперимента, теория новая и пока слабо воспроизведена.</li><li>Авторы продвигают собственную теорию — возможна заинтересованность.</li></ul>", "S-069": "<ul><li><strong>Автор:</strong> Шмелёва Е. Я., Шмелёв А. Д.</li><li><strong>Год:</strong> 2002</li><li><strong>Тип:</strong> монография</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 6</li><li><strong>Тема:</strong> T-06</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Анекдот — устный жанр: рассказчик никогда не претендует на авторство текста.</li><li>Структура всего из двух частей: зачин и развязка, без це d><td>1</td></tr><tr><td>Доказательность</td><td>1</td></tr><tr><td>Релевантность</td><td>2</td></tr><tr><td>Практичность</td><td>2</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>10/14</strong></td></tr></tbody></table>\n<p>Решение: включить, можно ссылаться в уроке.</p>\n<h2>Ограничения</h2>\n<ul><li>Вторично по отношению к S-069.</li><li>Журнальная публикация без научного аппарата.</li></ul>", "S-071": "<ul><li><strong>Автор:</strong> редакция «Ножа»</li><li><strong>Год:</strong> 2021</li><li><strong>Тип:</strong> популярная статья</li><li><strong>Ссылка:</strong> https://knife.media/anecdote-died/</li><li><strong>Доступ:</strong> полный текст</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 6</li><li><strong>Тема:</strong> T-06</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Анекдот как жанр угасает: нет общего культурного поля, в котором он работал.</li><li>Отличие анекдота от смешной истории — в отказе от авторства.</li><li>Зачин создаёт напряжение, развязка переворачивает ожидание.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-06: современный контекст — стоит ли вообще учиться рассказывать анекдоты.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td>Автор</td><td>1</td></tr><tr><td>Дата</td><td>1</td></tr><tr><td>Тип</td><td>1</td></tr><tr><td>Доказательность</td><td>1</td></tr><tr><td>Релевантность</td><td>1</td></tr><tr><td>Практичность</td><td>1</td></tr><tr><td>Доступ</td><td>1</td></tr><tr><td><strong>Итого</strong></td><td><strong>7/14</strong></td></tr></tbody></table>\n<p>Решение: на проверку, использовать осторожно.</p>\n<h2>Ограничения</h2>\n<ul><li>Популярная статья, опирается на интервью со Шмелёвыми: первоисточник — S-069.</li><li>Прогноз о «смерти жанра» — мнение, а не данные.</li></ul>", "S-073": "<ul><li><strong>Оригинальное название:</strong> Thirty-Five Years of Research on Neuro-Linguistic Programming</li><li><strong>Автор:</strong> Витковски Т.</li><li><strong>Год:</strong> 2010</li><li><strong>Тип:</strong> обзор</li><li><strong>Ссылка:</strong> https://doi.org/10.2478/v10059-010-0008-0</li><li><strong>Доступ:</strong> реферат</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 4</li><li><strong>Тема:</strong> T-01</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Отобрано 63 статьи из журналов международного индексирования ISI.</li><li>Подтверждают эффективность 18,2 %, неопределённый результат 27,3 %, опровергают 54,5 %.</li><li>Автор заключает, что НЛП работает как псевдонаучное украшение, а не как метод.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Числовая опора: больше половины качественных исследований метод опровергают.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>11/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Полного текста нет, цифры взяты из вторичных пересказов — статус «на проверке».</li><li>Выходные данные журнала не подтверждены.</li></ul>\n<h2>Проверка 07.11.2026</h2>\n<ul><li>Выходные данные подтверждены: Polish Psychological Bulletin, 2010, т. 41, № 2, с. 58–66, DOI 10.2478/v10059-010-0008-0.</li><li><strong>Расхождение в пересказах:</strong> часть источников пишет про 63 отобранные работы из 315 найденных, часть — про 33. Доли (18,2 / 27,3 / 54,5 %) везде совпадают. В статьях указываем 63 и отмечаем расхождение.</li><li>Полного текста нет, но библиографическая запись больше не под вопросом.</li></ul>", "S-074": "<ul><li><strong>Оригинальное название:</strong> Research findings on neurolinguistic programming: Nonsupportive data or an untestable theory?</li><li><strong>Автор:</strong> Шарпли К.</li><li><strong>Год:</strong> 1987</li><li><strong>Тип:</strong> обзор</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> нет доступа</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 4</li><li><strong>Тема:</strong> T-10</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Проанализированы исследования «ведущей репрезентативной системы» (визуал, аудиал, кинестетик).</li><li>Устойчивой ведущей системы не обнаружено; подстройка под предикаты собеседника пользы не даёт.</li><li>Поставлен вопрос: НЛП не столько не подтверждено, сколько сформулировано так, что непроверяемо.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Прямо бьёт по популярному приёму «определи тип собеседника и говори его словами».</li><li>Тема T-10: первый источник в пустующей теме.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>11/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Работа 1987 года, доступа к полному тексту нет.</li><li>Точное название и журнал требуют сверки по каталогу.</li></ul>", "S-075": "<ul><li><strong>Оригинальное название:</strong> Enhancing Human Performance: Issues, Theories, and Techniques</li><li><strong>Автор:</strong> Дракман Д., Свитс Дж. (ред.)</li><li><strong>Год:</strong> 1988</li><li><strong>Тип:</strong> отчёт</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> нет доступа</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 4</li><li><strong>Тема:</strong> T-01</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Отчёт Национального исследовательского совета США, подготовленный по запросу армии.</li><li>Комитет рассмотрел НЛП среди методик повышения результативности и не нашёл доказательств в его пользу.</li><li>Не подтверждена и модель влияния, на которой НЛП строит обучение переговорам.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Институциональная оценка: не частное мнение, а вывод государственной научной комиссии.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>12/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Отчёту почти сорок лет; более новые обзоры важнее.</li><li>Полного текста нет.</li></ul>", "S-076": "<ul><li><strong>Оригинальное название:</strong> The Applications of Neuro-Linguistic Programming in Organizational Settings: A Systematic Review</li><li><strong>Автор:</strong> Котера Ю., Шеффилд Д., ван Гордон У.</li><li><strong>Год:</strong> 2019</li><li><strong>Тип:</strong> систематический обзор</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> нет доступа</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 4</li><li><strong>Тема:</strong> T-01</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Обзор применения НЛП в организациях: обучение, управление, продажи.</li><li>База доказательств признана слабой и методологически ограниченной.</li><li>Отмечен разрыв: практика НЛП далеко опережает то, что подтверждено.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Самый свежий из найденных обзоров; показывает, что за сорок лет ничего не изменилось.</li><li>Закрывает именно ту область, где НЛП продают активнее всего, — деловое общение.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>12/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Полного текста нет, выводы по реферату и пересказам.</li></ul>", "S-077": "<ul><li><strong>Оригинальное название:</strong> The Eyes Don&#x27;t Have It: Lie Detection and Neuro-Linguistic Programming</li><li><strong>Автор:</strong> Уайзман Р. и др.</li><li><strong>Год:</strong> 2012</li><li><strong>Тип:</strong> исследование</li><li><strong>Ссылка:</strong> https://doi.org/10.1371/journal.pone.0040259</li><li><strong>Доступ:</strong> полный текст</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 4</li><li><strong>Тема:</strong> T-10</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Три исследования, включая записи реальных пресс-конференций с высокой ценой лжи.</li><li>Движения глаз не соответствовали схеме, которую предсказывает НЛП.</li><li>Более поздняя работа с айтрекингом подтвердила: взгляд смещается, но не в ту сторону, что обещает схема.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-10: конкретный разбор мифа о «глазных ключах доступа».</li><li>Образец того, как проверяемое утверждение НЛП проверили и опровергли.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>11/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Полного текста нет, выходные данные требуют сверки.</li></ul>\n<h2>Проверка 07.11.2026</h2>\n<ul><li>Выходные данные подтверждены: Wiseman R., Watt C., ten Brinke L., Porter S., Couper S.-L., Rankin C. «The eyes don&#x27;t have it: Lie detection and neuro-linguistic programming», PLoS ONE, 2012, 7(7), e40259, DOI 10.1371/journal.pone.0040259.</li><li>Статья в открытом доступе — это полный текст, а не реферат.</li><li>Детали: три эксперимента, включая разбор 52 реальных видео с известной правдой; обученная схеме НЛП группа распознавала ложь не лучше контрольной.</li></ul>", "S-078": "<ul><li><strong>Оригинальное название:</strong> Sleight of Mouth: The Magic of Conversational Belief Change</li><li><strong>Автор:</strong> Дилтс Р.</li><li><strong>Год:</strong> 1999</li><li><strong>Тип:</strong> практическое руководство</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 4</li><li><strong>Тема:</strong> T-01</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Описывает четырнадцать речевых паттернов переформулирования убеждения.</li><li>Паттерны строятся на смене рамки: намерение, последствие, аналогия, иерархия критериев, другой масштаб.</li><li>Источник приёмов — наблюдение автора за риторикой, а не эксперимент.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Берём как каталог речевых ходов, не как доказанный метод.</li><li>Переформулирование само по себе имеет опору в когнитивно-поведенческой терапии — но это заслуга КПТ, а не НЛП.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>6/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Это НЛП: научной поддержки у рамки нет (S-028, S-073, S-076).</li><li>Низкая оценка за доказательность выставлена сознательно: книга полезна практически, но не является свидетельством.</li><li>Год русских переизданий не сверяли.</li></ul>", "S-079": "<ul><li><strong>Оригинальное название:</strong> The Pyramid Principle: Logic in Writing and Thinking</li><li><strong>Автор:</strong> Минто Б.</li><li><strong>Год:</strong> 1987</li><li><strong>Тип:</strong> практическое руководство</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 2</li><li><strong>Тема:</strong> T-03</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Главная мысль сначала, обоснования под ней; группы аргументов не пересекаются и покрывают тему целиком.</li><li>Схема вступления: ситуация — осложнение — вопрос — ответ.</li><li>Разработано в McKinsey для деловых документов и устных докладов.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-03 и урок 2: готовая структура для быстрого устного ответа.</li><li>Не имеет отношения к НЛП, несмотря на совпадение слова «пирамида» с логическими уровнями Дилтса.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>10/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Это методика письма и доклада, а не живого разговора: в быстрой беседе применима ограниченно.</li><li>Контролируемых проверок эффективности нет — это профессиональный стандарт, а не исследование.</li></ul>", "S-080": "<ul><li><strong>Оригинальное название:</strong> Gestalt: l&#x27;art du contact</li><li><strong>Автор:</strong> Гингер С.</li><li><strong>Год:</strong> 1995</li><li><strong>Тип:</strong> научно-популярная книга</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 4</li><li><strong>Тема:</strong> T-01</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Вводит понятие контакта и цикла контакта между человеком и средой.</li><li>Внимание к тому, что происходит «здесь и сейчас», в том числе к телесным ощущениям в разговоре.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Возможная опора для темы присутствия и осознавания в контакте.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>8/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Гештальт-подход как терапия имеет ограниченную доказательную базу; переносить выводы на бытовое общение нельзя.</li><li>Издание и год русского перевода не сверяли — статус «на проверке».</li></ul>", "S-081": "<ul><li><strong>Автор:</strong> Захарьин А.</li><li><strong>Год:</strong> 2019</li><li><strong>Тип:</strong> практическое руководство</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 5</li><li><strong>Тема:</strong> T-04</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Русскоязычное пособие по импровизации с упражнениями.</li><li>Отдельный блок — для тех, кто боится выступать.</li><li>Упор на практику, а не на теорию жанра.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-04: первая русскоязычная практическая книга по импровизации в базе.</li><li>Закрывает просьбу искать русские источники, а не только переводные.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>9/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Выходные данные и год не сверены по каталогу — статус «на проверке».</li><li>Проверок эффективности упражнений нет: это опыт автора.</li></ul>", "S-082": "<ul><li><strong>Автор:</strong> Шабанов С., Алешина А.</li><li><strong>Год:</strong> 2013</li><li><strong>Тип:</strong> практическое руководство</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 1</li><li><strong>Тема:</strong> T-01</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Распознавание и называние собственных эмоций как первый шаг к управлению ими.</li><li>Материал построен на российских корпоративных примерах, а не на переводных кейсах.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-01: русскоязычная практика осознавания эмоций перед разговором.</li><li>Дополняет S-042 (Гоулман) местным материалом.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>8/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Сам конструкт «эмоциональный интеллект» в науке спорен: предсказательная сила слабее заявленной.</li><li>Книга практическая, исследований в ней нет.</li><li>Год издания не сверен.</li></ul>", "S-083": "<ul><li><strong>Оригинальное название:</strong> Free Play: Improvisation in Life and Art</li><li><strong>Автор:</strong> Нахманович С.</li><li><strong>Год:</strong> 1990</li><li><strong>Тип:</strong> научно-популярная книга</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 5</li><li><strong>Тема:</strong> T-04</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Импровизация подана как способ присутствия в моменте, а не как набор приёмов.</li><li>Много о страхе ошибки и о том, как он останавливает спонтанность.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-04, поздняя ступень: осмысление, когда приёмы уже освоены.</li><li>Совпадает с механизмом из S-060: работает снятие страха ошибки, а не техника.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>8/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Эссеистика, а не исследование: проверяемых утверждений почти нет.</li><li>Год русского издания не сверен.</li></ul>", "S-084": "<ul><li><strong>Оригинальное название:</strong> Save the Cat! The Last Book on Screenwriting You&#x27;ll Ever Need</li><li><strong>Автор:</strong> Снайдер Б.</li><li><strong>Год:</strong> 2005</li><li><strong>Тип:</strong> практическое руководство</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 6</li><li><strong>Тема:</strong> T-05</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Структура истории как последовательность опорных точек.</li><li>Приём «спасите котика»: герою дают поступок, который вызывает симпатию, до начала основного действия.</li><li>Удержание внимания через смену ожиданий.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-05: самая практичная из книг по структуре истории, подходит для коротких устных историй.</li><li>Приём с ранней симпатией переносится на рассказ о себе в компании.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>9/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Написано про полнометражный сценарий: прямой перенос на устную историю требует сокращения в разы.</li><li>Никаких проверок, это ремесленный стандарт индустрии.</li><li>Год русского перевода не сверен.</li></ul>", "S-089": "<ul><li><strong>Автор:</strong> Непряхин Н. Ю.</li><li><strong>Год:</strong> 2015</li><li><strong>Тип:</strong> практическое руководство</li><li><strong>Ссылка:</strong> <a href=\"https://www.labirint.ru/books/321086/\" target=\"_blank\" rel=\"noopener\">labirint.ru</a></li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 2</li><li><strong>Тема:</strong> T-07</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Пятьдесят частых вопросов о выступлениях и презентациях с короткими практическими ответами.</li><li>Построено как диалог с читателем, примеры из российской практики.</li><li>2-е издание, «Альпина Паблишер», ISBN 978-5-9614-1820-0.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Формат «вопрос — ответ» удобен как справочник: не читать подряд, а искать свою ситуацию.</li><li>Русская практика, как и просил пользователь.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>10/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Автор — бизнес-тренер, приёмы авторские и нигде не проверялись.</li><li>Глубины нет по формату: ответ на вопрос занимает страницу.</li></ul>", "S-086": "<ul><li><strong>Автор:</strong> Михальская А. К.</li><li><strong>Год:</strong> 2023</li><li><strong>Тип:</strong> учебник</li><li><strong>Ссылка:</strong> <a href=\"https://znanium.ru/catalog/document?id=424911\" target=\"_blank\" rel=\"noopener\">znanium.ru</a></li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> проверено</li><li><strong>Уроки:</strong> 2</li><li><strong>Тема:</strong> T-07</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Классический аппарат риторики: риторический канон, топика, хрия.</li><li>Теория дискурса и речевого поведения, история риторики.</li><li>Отдельный раздел об элитарной речевой культуре; курсы ораторской подготовки, деловой речи и речевого креатива с тренингами.</li><li>480 страниц, ИНФРА-М, ISBN 978-5-16-013162-7, DOI 10.12737/textbook_5b7667b498ddb4.10996853.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Академическая опора под тем, что у Шипунова дано как набор приёмов.</li><li>Риторический канон и топика — готовый ответ на вопрос «откуда брать содержание речи».</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>13/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Учебник для филологов и журналистов: часть материала к бытовому разговору отношения не имеет.</li><li>480 страниц — читать выборочно, не подряд.</li><li>Полного текста у меня нет, карточка составлена по описанию издателя и оглавлению.</li></ul>", "S-087": "<ul><li><strong>Автор:</strong> Аннушкин В. И.</li><li><strong>Год:</strong> 2016</li><li><strong>Тип:</strong> учебное пособие</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 2</li><li><strong>Тема:</strong> T-07</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Сжатое изложение основных разделов риторики как науки об убедительной речи.</li><li>Образцы классических речей и современных учебных выступлений.</li><li>Практические задания и упражнения; 224 страницы, «Флинта», ISBN 978-5-89349-896-7.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Короткий вход в академическую риторику — мост между Шипуновым и Михальской.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>11/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Полного текста нет, карточка по описанию издателя.</li><li>Пособие для вуза: формат заданий рассчитан на занятия с преподавателем.</li></ul>", "S-088": "<ul><li><strong>Автор:</strong> Ивин А. А.</li><li><strong>Год:</strong> 2016</li><li><strong>Тип:</strong> учебник</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 2</li><li><strong>Тема:</strong> T-03</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Систематизация приёмов воздействия речью на убеждения.</li><li>Разводит аргументацию как обращение к разуму и приёмы, работающие помимо него.</li><li>Учитывает три стороны ситуации убеждения: саму речь, говорящего и аудиторию.</li><li>2-е издание, «Юрайт», 300 страниц, ISBN 978-5-9916-2329-2.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-03: даёт логическую основу под структуру ответа, которой нет у Минто.</li><li>Полезен как проверка: позволяет отличить аргумент от риторического приёма.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>12/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Учебник по логике и философии: к бытовому разговору применим через перевод.</li><li>Полного текста нет.</li></ul>", "S-090": "<ul><li><strong>Автор:</strong> Шестакова Е. С.</li><li><strong>Год:</strong> 2024</li><li><strong>Тип:</strong> практическое руководство</li><li><strong>Ссылка:</strong> —</li><li><strong>Доступ:</strong> печатное издание</li><li><strong>Статус:</strong> на проверке</li><li><strong>Уроки:</strong> 2</li><li><strong>Тема:</strong> T-09</li></ul>\n<h2>Что говорит</h2>\n<ul><li>Постановка голоса и речи: дыхание, звучание, дикция.</li><li>Есть продолжение — «Говори красиво и уверенно каждый день. Настрой голос и речь за 5 недель», издательство «Питер», 2024.</li></ul>\n<h2>Что берём</h2>\n<ul><li>Тема T-09 была практически пуста: это первый источник, целиком посвящённый голосу.</li><li>Русскоязычный практикум с упражнениями.</li></ul>\n<h2>Оценка</h2>\n<table><thead><tr><th>Критерий</th><th>Балл</th></tr></thead><tbody><tr><td><strong>Итого</strong></td><td><strong>9/14</strong></td></tr></tbody></table>\n<h2>Ограничения</h2>\n<ul><li>Выходные данные взяты из книжного каталога, ISBN не сверен — «на проверке».</li><li>Проверок эффективности упражнений нет.</li><li>Академического источника по фонации это не заменяет.</li></ul>"}, "path": "<p>Маршрут чтения. Не список книг по порядку, а последовательность задач: что болит сейчас → что про это известно → что сделать → как понять, что можно идти дальше.</p>\n<h2>Почему не по месяцам</h2>\n<p>Срок «0–6 месяцев» ничего не обещает: один человек за месяц начнёт заговаривать с незнакомыми, другой за год не решится. Привязка к календарю создаёт ложное чувство отставания и ничего не измеряет.</p>\n<p>Поэтому ступени привязаны не ко времени, а к тому, <strong>что у тебя перестало ломаться</strong>. Переход на следующую — когда предыдущая не требует усилия.</p>\n<p>Порядок один и тот же для всех только в начале. С третьей ступени можно идти в ту сторону, которая интереснее.</p>\n<h2>Ступень 1. Заговорить</h2>\n<p><strong>Что болит:</strong> не подойти, не начать. Молчание кажется безопаснее.</p>\n<p><strong>Читать у нас:</strong> A-003 «С чего начать разговор с незнакомым человеком».</p>\n<p><strong>Книга:</strong> Файн, «Тонкое искусство светской беседы» (S-013). Семь заходов, как завязать разговор, и — важнее — как из него выйти.</p>\n<p><strong>Делать:</strong> один разговор в день с человеком, которого не обязан был заговаривать. Кассир, сосед, коллега из другого отдела. Цель не понравиться, а начать.</p>\n<p><strong>Пройдено, когда:</strong> подойти стоит усилия, но не страха.</p>\n<h2>Ступень 2. Не пустеть</h2>\n<p><strong>Что болит:</strong> начал — и в голове пусто. Слышишь себя со стороны.</p>\n<p><strong>Читать у нас:</strong> A-002 «Почему в разговоре пустеет голова».</p>\n<p><strong>Книги:</strong> Минто, «Принцип пирамиды» (S-079) — главная мысль первой, обоснование потом. Шабанов и Алешина, «Эмоциональный интеллект. Российская практика» (S-082) — назвать своё состояние, чтобы оно перестало управлять.</p>\n<p><strong>Делать:</strong> отвечать по схеме «вывод → одна причина → пример». Три предложения. Длиннее не надо.</p>\n<p>Если захочется понять, чем аргумент отличается от красивого приёма — Ивин, «Теория и практика аргументации» (S-088). Это учебник, читать выборочно.</p>\n<p><strong>Пройдено, когда:</strong> пауза перестала быть катастрофой и ты договариваешь мысль до конца.</p>\n<h2>Ступень 3. Не бояться внимания</h2>\n<p><strong>Что болит:</strong> когда смотрят несколько человек, тело выходит из-под контроля.</p>\n<p><strong>Читать у нас:</strong> A-001 «Страх публичного выступления».</p>\n<p><strong>Книги:</strong> Шипунов, «Харизматичный оратор» (S-035) — <strong>каркас всей ступени</strong>: более 30 параметров мастерства перечислены списком, от страха сцены до пауз и жестов. Как опись того, из чего вообще складывается навык, книга лучшая из найденных.</p>\n<p>Но она же и самая поверхностная: каждый параметр разобран коротко, а автор продаёт свой курс — конфликт интересов налицо. Поэтому сразу за ней идёт глубина: Михальская, «Риторика» (S-086) — вузовский учебник с риторическим каноном и топикой, то есть с ответом на вопрос «откуда брать содержание речи». Короткий мост между ними — Аннушкин, «Риторика. Экспресс-курс» (S-087).</p>\n<p>Если ломается голос, а не содержание — Шестакова, «Говори красиво и уверенно» (S-090): дыхание, звучание, дикция. Это единственная книга в базе целиком про голос.</p>\n<p>Как справочник под руку: Непряхин, «Как выступать публично. 50 вопросов и ответов» (S-089) — не читать подряд, а находить свою ситуацию.</p>\n<p>Дополнительно: материалы Toastmasters (S-022), классика в общественном достоянии (S-056, S-057).</p>\n<p><strong>Делать:</strong> говорить стоя и вслух, перед людьми. Не репетировать в голове — там страх не тренируется.</p>\n<p><strong>Пройдено, когда:</strong> волнение есть, а речь от него не разваливается.</p>\n<h2>Ступень 4. Рассказывать</h2>\n<p><strong>Что болит:</strong> истории получаются длинными, слушатель отключается.</p>\n<p><strong>Читать у нас:</strong> A-005 «Как устроен анекдот» — там же про разницу между анекдотом и своей историей.</p>\n<p><strong>Книги:</strong> Снайдер, «Спасите котика!» (S-084) — опорные точки истории и приём ранней симпатии. Хит и Хит, «Сделано, чтобы прилипнуть» (S-019) — почему одно запоминается, а другое нет. Шмелёвы, «Русский анекдот» (S-069) — если тянет именно в анекдот.</p>\n<p><strong>Делать:</strong> взять свою историю и сократить вдвое. Потом ещё вдвое. Выкидывается всё, что не готовит развязку.</p>\n<p><strong>Пройдено, когда:</strong> история укладывается в минуту и её дослушивают.</p>\n<h2>Ступень 5. Отпустить заготовки</h2>\n<p><strong>Что болит:</strong> всё заученное работает, но живого разговора не выходит. Ждёшь своей реплики вместо того, чтобы слушать.</p>\n<p><strong>Читать у нас:</strong> A-004 «Работает ли импровизация».</p>\n<p><strong>Книги:</strong> Захарьин, «Искусство импровизации» (S-081) — русская практика с упражнениями. Кулхан, «Искусство „Да, и“» (S-014). Джонстон, «Импровизация и театр» (S-017) — про то, что мешает спонтанности страх оценки, а не нехватка идей.</p>\n<p><strong>Делать:</strong> здесь единственный раз рекомендую выйти из чтения. Группа импровизации — это <strong>самая обоснованная рекомендация во всём маршруте</strong>: в исследовании на 266 школьниках курс снизил социальную тревогу с большим размером эффекта, причём эффект зависел от активности участия (S-060). Двадцати минут упражнений хватает для измеримого сдвига (S-061). Оговорки — в статье A-004, они существенные.</p>\n<p><strong>Пройдено, когда:</strong> можешь начать фразу, не зная, чем закончишь.</p>\n<h2>Ступень 6. Отличать рабочее от модного</h2>\n<p><strong>Что болит:</strong> вокруг много школ и методик, непонятно, чему верить.</p>\n<p><strong>Читать у нас:</strong> A-006 «Работают ли приёмы НЛП».</p>\n<p><strong>Книги:</strong> Нахманович, «В состоянии потока» (S-083) — когда приёмы освоены, остаётся вопрос присутствия. Макки, «История» (S-018) — если структура историй затянула всерьёз.</p>\n<p><strong>Делать:</strong> про любой приём спрашивать «откуда это известно». Половина советов не переживает вопроса.</p>\n<p><strong>Пройдено, когда:</strong> спокойно откладываешь модную методику без чувства, что упускаешь.</p>\n<h2>Что я убрал из исходного списка и почему</h2>\n<p><strong>Четыре книги по сценарному мастерству — это перебор.</strong> В присланном списке были Труби, Снайдер, Воглер и Макки. Все четыре учат строить двухчасовой фильм. Для истории на сорок секунд за столом нужна одна книга, максимум две. Оставил Снайдера (самый практичный) и Макки (для тех, кого затянуло). Труби и Воглера не брал: они повторяют то же самое подробнее.</p>\n<p><strong>«Путешествие писателя» Воглера — отдельный случай.</strong> Мономиф хорош для романа, но застольная история по нему превращается в эпос. Это прямой путь к тому, чтобы слушатель заскучал.</p>\n<p><strong>Порядок был перевёрнут в двух местах.</strong> «Да, и» Кулхана стояло в «продвинутом» — но это первое, чему учат на любом занятии по импровизации. Файн со светской беседой тоже была в конце, хотя «не могу подойти» — проблема номер один, с неё всё начинается. Я поднял обе ближе к началу.</p>\n<p><strong>Эмоциональный интеллект как книга №1 — спорно.</strong> Конструкт в науке обсуждается, предсказательная сила слабее, чем в популярных книгах. Не убрал, но перенёс на вторую ступень и добавил оговорку в карточку S-082.</p>\n<p><strong>Чего в списке не было совсем:</strong> исследований. Одиннадцать практических книг и ни одной проверки, работает ли это. У нас для каждой ступени есть статья с источниками — она и есть ответ на вопрос «почему именно так».</p>\n<p>Ещё не было анекдотов, хотя это названный приоритет. Добавил на четвёртую ступень Шмелёвых.</p>\n<h2>Про курсы</h2>\n<p>Коротко: <strong>из всего маршрута офлайн нужен только на пятой ступени.</strong></p>\n<ul><li><strong>Группа импровизации</strong> — единственный пункт с доказательной базой</li></ul>\n<p>(S-060, S-061). Школ много: ИмпроКультура, IMPROSCHOOL, занятия Вьюшкина. Конкретную выбирать по пробному занятию, а не по сайту.</p>\n<ul><li><strong>Актёрский интенсив</strong> (например, в театре) — осмысленно после</li></ul>\n<p>импровизации, не вместо.</p>\n<ul><li><strong>Онлайн-курсы по коммуникациям</strong> (Skillbox, Академия АйТи) —</li></ul>\n<p>пропускаемо. Это пересказ тех же книг в формате видео; на четвёртой ступени «Сторителлинг» у Skillbox вообще смещён в копирайтинг.</p>\n<p>Осторожно с обещаниями школ. «Уверенность за восемь занятий» — это ровно то, чего наши же источники не подтверждают: эффект измерен на подростках, без контрольной группы, с отсевом 45 %.</p>\n<h2>Чего в маршруте нет</h2>\n<ul><li><strong>Голос и речь</strong> — тема T-09 в библиотеке пуста. Пока сказать нечего.</li><li><strong>Невербалика</strong> — два источника, и оба разбирают мифы. Поэтому</li></ul>\n<p>отдельной ступени «язык тела» здесь нет: честнее промолчать, чем пересказывать «правило 7-38-55».</p>\n<ul><li><strong>Проверки, что маршрут работает.</strong> Он собран из источников по каждой</li></ul>\n<p>теме, но как целое не проверялся ни на ком. Это гипотеза, а не метод.</p>", "built": "07.11.2026"};
const $ = (s) => document.querySelector(s);
let view = 'articles', current = null, q = '', topic = 'all';

const KEY = 'chitalnya:read:v1';
const readSet = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); }
                        catch (e) { return new Set(); } };
const markRead = (id) => { const s = readSet(); s.add(id);
  try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch (e) {} };

const topicName = (id) => (DATA.topics.find(t => t.id === id) || {}).title || id;

function listArticles() {
  const done = readSet();
  const items = DATA.articles.filter(a =>
    (topic === 'all' || a.topic === topic) &&
    (!q || (a.title + ' ' + a.text + ' ' + topicName(a.topic)).toLowerCase().includes(q)));
  const opts = ['<option value="all">все темы</option>']
    .concat(DATA.topics.filter(t => DATA.articles.some(a => a.topic === t.id))
      .map(t => `<option value="${t.id}"${topic === t.id ? ' selected' : ''}>${t.title}</option>`));
  return `<div class="tools">
      <input id="q" placeholder="поиск по статьям" value="${q.replace(/"/g, '&quot;')}">
      <select id="t">${opts.join('')}</select>
    </div>
    <div class="sum">${items.length} из ${DATA.articles.length} · прочитано ${done.size}</div>` +
    (items.length ? items.map(a => `<div class="card" data-id="${a.id}">
        <h3>${a.title}</h3>
        <div class="meta"><span class="tag">${topicName(a.topic)}</span>
          <span>${a.reading}</span><span>${a.sources.length} источников</span>
          ${done.has(a.id) ? '<span class="read">прочитано</span>' : ''}</div>
      </div>`).join('')
      : '<div class="empty">Ничего не нашлось. Попробуй другое слово.</div>');
}

function showArticle(a) {
  markRead(a.id);
  const used = DATA.sources.filter(s => a.sources.includes(s.id));
  return `<button class="back" id="back">← ко всем статьям</button>
    <article>
      <h1>${a.title}</h1>
      <div class="meta" style="margin-bottom:18px"><span class="tag">${topicName(a.topic)}</span>
        <span>${a.reading}</span><span>обновлено ${a.updated}</span></div>
      ${a.html}
      <h2>Источники этой статьи</h2>
      ${used.map(s => `<div class="src"><b>${s.title}</b><div class="meta">
        <span>${s.author}</span><span>${s.year}</span>
        <span class="${s.status === 'проверено' ? 'ok' : 'warn'}">${s.status}</span></div></div>`).join('')}
    </article>`;
}

function listSources() {
  const items = DATA.sources.filter(s => !q ||
    (s.title + ' ' + s.author + ' ' + s.kind).toLowerCase().includes(q));
  const ok = DATA.sources.filter(s => s.status === 'проверено').length;
  return `<div class="tools"><input id="q" placeholder="поиск по источникам"
      value="${q.replace(/"/g, '&quot;')}"></div>
    <div class="sum">${items.length} из ${DATA.sources.length} · проверено ${ok}</div>` +
    items.map(s => `<div class="src">
      <b>${s.title}</b>
      <div class="meta"><span>${s.author}</span><span>${s.year}</span><span>${s.kind}</span>
        <span>${s.score}</span>
        <span class="${s.status === 'проверено' ? 'ok' : 'warn'}">${s.status}</span>
        ${s.link && s.link !== '—' ? '<span>' + s.link + '</span>' : ''}</div>
      ${DATA.notes[s.id] ? `<details class="note"><summary>конспект</summary>${DATA.notes[s.id]}</details>` : ''}
    </div>`).join('');
}

function render() {
  $('#tab-a').className = view === 'articles' ? 'on' : '';
  $('#tab-p').className = view === 'path' ? 'on' : '';
  $('#tab-l').className = view === 'library' ? 'on' : '';
  $('#app').innerHTML = current ? showArticle(current)
    : view === 'articles' ? listArticles()
    : view === 'path' ? `<article>${DATA.path}</article>`
    : listSources();
  $('#foot').textContent = `${DATA.articles.length} статей · ${DATA.sources.length} источников · собрано ${DATA.built}`;
  const qi = $('#q');
  if (qi) { qi.oninput = (e) => { q = e.target.value.toLowerCase().trim(); render(); qi2(); }; }
  const ti = $('#t');
  if (ti) ti.onchange = (e) => { topic = e.target.value; render(); };
  document.querySelectorAll('.card').forEach(c => c.onclick = () => {
    current = DATA.articles.find(a => a.id === c.dataset.id);
    window.scrollTo(0, 0); render();
  });
  const b = $('#back');
  if (b) b.onclick = () => { current = null; window.scrollTo(0, 0); render(); };
}
function qi2() { const i = $('#q'); if (i) { i.focus(); i.selectionStart = i.value.length; } }

$('#tab-a').onclick = () => { view = 'articles'; current = null; q = ''; render(); };
$('#tab-p').onclick = () => { view = 'path'; current = null; q = ''; render(); };
$('#tab-l').onclick = () => { view = 'library'; current = null; q = ''; render(); };
render();
</script>
</body>
</html>
