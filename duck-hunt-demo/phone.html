<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Пульт прицела</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#14262c;color:#f2f7f4;font-family:system-ui,sans-serif;display:flex;flex-direction:column;touch-action:none;user-select:none}.head{padding:22px 20px 10px}.eyebrow{color:#8fceb1;font-size:11px;letter-spacing:.16em;font-weight:700}.head h1{font-size:25px;margin:7px 0 3px;letter-spacing:-.04em}.head p{font-size:13px;color:#a9bfbd;margin:0}.aim{position:relative;flex:1;margin:14px 14px 18px;border:1px solid #31565a;border-radius:22px;background:radial-gradient(circle at 50% 45%,#24464a 0,#19363c 43%,#122a30 100%);overflow:hidden;min-height:300px}.grid{position:absolute;inset:0;background:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:25% 25%}.reticle{position:absolute;left:50%;top:50%;width:84px;height:84px;transform:translate(-50%,-50%);border:2px solid #8fe0b1;border-radius:50%;box-shadow:0 0 25px #78dba755}.reticle:before,.reticle:after{content:"";position:absolute;background:#8fe0b1}.reticle:before{height:2px;width:128px;left:-24px;top:39px}.reticle:after{width:2px;height:128px;left:39px;top:-24px}.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#f37a46;left:50%;top:50%;transform:translate(-50%,-50%)}.aim label{position:absolute;left:0;right:0;bottom:20px;text-align:center;color:#a9bfbd;font-size:12px}.shoot{margin:0 auto 24px;width:min(72vw,280px);aspect-ratio:1;border:0;border-radius:50%;background:linear-gradient(145deg,#f2814b,#c94d28);box-shadow:0 12px 0 #87331f,0 18px 35px #0006;color:white;font-size:18px;font-weight:800;letter-spacing:.04em}.shoot:active{transform:translateY(8px);box-shadow:0 4px 0 #87331f,0 8px 20px #0006}.state{text-align:center;color:#8fceb1;font-size:12px;margin-bottom:15px}.state.off{color:#dc9e80}@media(min-width:700px){body{max-width:480px;margin:auto;border-left:1px solid #28444a;border-right:1px solid #28444a}}
</style></head><body><header class="head"><div class="eyebrow">ANDROID ПУЛЬТ • ЛОКАЛЬНАЯ WI-FI</div><h1>Прицел</h1><p>Двигайте телефоном или пальцем по полю. Кнопка — выстрел.</p></header><main class="aim" id="aim"><div class="grid"></div><div class="reticle" id="reticle"><div class="dot"></div></div><label>наведите прицел на утку</label></main><div class="state" id="state">Подключение…</div><button class="shoot" id="shoot">ВЫСТРЕЛ</button><script>
const token=new URLSearchParams(location.search).get('token')||'';const aim=document.getElementById('aim'),reticle=document.getElementById('reticle'),state=document.getElementById('state');let point={x:.5,y:.5},lastSent=0;
function move(e){const r=aim.getBoundingClientRect(),touch=e.touches?e.touches[0]:e;point.x=Math.max(0,Math.min(1,(touch.clientX-r.left)/r.width));point.y=Math.max(0,Math.min(1,(touch.clientY-r.top)/r.height));reticle.style.left=(point.x*100)+'%';reticle.style.top=(point.y*100)+'%';send(false)}
async function send(fire){const now=Date.now();if(!fire&&now-lastSent<45)return;lastSent=now;try{await fetch('/api/input?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...point,fire})});state.textContent='Подключено к игре';state.className='state'}catch(e){state.textContent='Нет связи с компьютером';state.className='state off'}}
aim.addEventListener('pointermove',move);aim.addEventListener('pointerdown',e=>{move(e);send(false)});document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();send(true);setTimeout(()=>send(false),90)});setInterval(()=>send(false),1800);send(false);
</script></body></html>
