<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет — Sociora</title>
<meta name="description" content="Личный кабинет Sociora: проекты, генерация постов, соцсети, расписание, аналитика, тарифы.">
<meta name="theme-color" content="#0a0a13">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body class="app-body">
<div class="bg-glows"></div>

<div class="app" id="app" hidden>
  <aside class="sidebar">
    <a class="logo" href="/"><span class="logo-mark">S</span>Sociora</a>
    <nav class="side-nav" id="side-nav">
      <a href="#/overview" data-nav="overview"><span class="ico">📊</span>Обзор</a>
      <a href="#/projects" data-nav="projects"><span class="ico">📁</span>Проекты</a>
      <a href="#/posts" data-nav="posts"><span class="ico">📝</span>Посты</a>
      <a href="#/plan" data-nav="plan"><span class="ico">🗓️</span>Контент-план</a>
      <a href="#/socials" data-nav="socials"><span class="ico">🔗</span>Соцсети</a>
      <a href="#/analytics" data-nav="analytics"><span class="ico">📈</span>Аналитика</a>
      <a href="#/billing" data-nav="billing"><span class="ico">💳</span>Тарифы</a>
      <a href="#/settings" data-nav="settings"><span class="ico">⚙️</span>Настройки</a>
    </nav>
    <div class="side-foot">
      <a href="/" class="to-site">← На сайт</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="burger" id="app-burger" aria-label="Меню"><span></span><span></span><span></span></button>
      <div class="topbar-title" id="topbar-title">Обзор</div>
      <div class="topbar-right">
        <span class="balance" id="top-balance" title="Баланс постов"></span>
        <span class="plan-badge" id="top-plan"></span>
        <span class="user-mail" id="top-user"></span>
        <button class="btn btn-ghost btn-sm" id="btn-logout">Выйти</button>
      </div>
    </header>
    <main class="content" id="content"><div class="loading">Загрузка…</div></main>
  </div>
</div>

<div class="auth-needed" id="auth-needed" hidden>
  <div class="auth-card">
    <h1>Требуется вход</h1>
    <p>Чтобы попасть в личный кабинет, войдите или зарегистрируйтесь.</p>
    <div class="auth-actions">
      <a class="btn btn-primary" href="/login">Войти</a>
      <a class="btn btn-ghost" href="/register">Регистрация</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app/app.js"></script>
</body>
</html>
