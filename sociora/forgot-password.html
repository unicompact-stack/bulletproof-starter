<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Восстановление пароля — Sociora</title>
<meta name="description" content="Восстановление пароля от личного кабинета Sociora.">
<meta name="theme-color" content="#0a0a13">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="bg-glows"></div>
<div class="auth-page">
  <div class="auth-box">
    <a class="back" href="/">← Назад к входу</a>
    <div class="panel">
      <a class="logo" href="/" style="margin-bottom:22px"><span class="logo-mark">S</span>Sociora</a>
      <h1>Восстановление пароля</h1>
      <p class="sub">Введите email — пришлём ссылку для сброса пароля</p>
      <div class="form-error" id="error"></div>
      <div style="padding:18px;border-radius:14px;background:rgba(124,108,255,.08);border:1px solid rgba(124,108,255,.25);margin-bottom:18px">
        <b style="display:block;margin-bottom:6px">Это демо-копия</b>
        <span style="font-size:13.5px;color:var(--muted)">Реальная отправка писем не подключена. Если вы забыли пароль от демо-аккаунта — он указан ниже, либо создайте новый аккаунт.</span>
        <div style="margin-top:10px;font-size:13.5px;color:var(--muted)">
          Демо: <code style="color:#c4b5fd">demo@sociora.ru / demo1234</code>
        </div>
      </div>
      <form id="form-reset">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.ru" autocomplete="email" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="btn-submit">Отправить ссылку</button>
      </form>
      <div class="auth-switch">Вспомнили пароль? <a href="/login">Войти</a></div>
    </div>
  </div>
</div>
<script>
(function () {
  var form = document.getElementById("form-reset");
  var error = document.getElementById("error");
  var btn = document.getElementById("btn-submit");

  function showError(msg) {
    error.textContent = msg;
    error.classList.add("show");
  }

  form.onsubmit = function (e) {
    e.preventDefault();
    error.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Отправляем…";
    setTimeout(function () {
      btn.textContent = "✓ Ссылка отправлена (демо)";
      setTimeout(function () { location.href = "/login"; }, 1200);
    }, 500);
  };
})();
</script>
</body>
</html>
