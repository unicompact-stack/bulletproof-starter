<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Sociora</title>
<meta name="description" content="Вход в личный кабинет Sociora.">
<meta name="theme-color" content="#0a0a13">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<div class="bg-glows"></div>
<div class="auth-page">
  <div class="auth-box">
    <a class="back" href="/">← На главную</a>
    <div class="panel">
      <a class="logo" href="/" style="margin-bottom:22px"><span class="logo-mark">S</span>Sociora</a>
      <h1>Вход в кабинет</h1>
      <p class="sub">Введите email и пароль, указанные при регистрации</p>
      <div class="form-error" id="error"></div>
      <form id="form-login">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.ru" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="btn-submit">Войти</button>
      </form>
      <div style="display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--faint);font-size:12.5px">
        <span style="flex:1;height:1px;background:var(--border)"></span>или<span style="flex:1;height:1px;background:var(--border)"></span>
      </div>
      <div id="demo">
        <button class="btn btn-ghost btn-block" id="btn-demo" type="button">🚀 Войти в демо-режиме (без регистрации)</button>
      </div>
      <div class="auth-switch">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
    </div>
  </div>
</div>
<script>
(function () {
  var form = document.getElementById("form-login");
  var error = document.getElementById("error");
  var btn = document.getElementById("btn-submit");

  function showError(msg) {
    error.textContent = msg;
    error.classList.add("show");
  }

  // если токен уже сохранён (даже если cookie потерялись) — сразу ведём в кабинет
  var saved = null;
  try { saved = localStorage.getItem("sociora_token"); } catch (e) {}
  var tokenMatch = /[?&]token=([^&]+)/.exec(location.search || "") ||
                   /[#&]token=([^&]+)/.exec(location.hash || "");
  if (tokenMatch) { saved = decodeURIComponent(tokenMatch[1]); }
  if (saved) {
    fetch("/api/me", { headers: { "Authorization": "Bearer " + saved }, credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.ok) location.replace("/app/"); })
      .catch(function () {});
  } else {
    fetch("/api/me", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.ok) location.replace("/app/"); })
      .catch(function () {});
  }

  form.onsubmit = function (e) {
    e.preventDefault();
    error.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Входим…";
    doLogin(form.email.value.trim(), form.password.value);
  };

  // переход по ссылке /login#demo — сразу входим в демо-режим
  if (location.hash === "#demo") {
    setTimeout(function () { document.getElementById("btn-demo").click(); }, 150);
  }

  document.getElementById("btn-demo").onclick = function () {
    this.disabled = true;
    this.textContent = "Готовим демо-данные…";
    error.classList.remove("show");
    doLogin("demo@sociora.ru", "demo1234");
  };

  function doLogin(email, password) {
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ email: email, password: password })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (res) {
        if (res.data.ok) {
          // сохраняем токен: cookie может не дойти, поэтому дублируем в hash
          try { localStorage.setItem("sociora_token", res.data.token); } catch (e) {}
          location.href = "/app/?token=" + encodeURIComponent(res.data.token);
        } else {
          showError(res.data.error || "Неверный email или пароль");
          btn.disabled = false;
          btn.textContent = "Войти";
          var demo = document.getElementById("btn-demo");
          demo.disabled = false;
          demo.textContent = "🚀 Войти в демо-режиме (без регистрации)";
        }
      })
      .catch(function () {
        showError("Сервер недоступен. Проверьте, что запущен server.py");
        btn.disabled = false;
        btn.textContent = "Войти";
      });
  }
})();
</script>
</body>
</html>
