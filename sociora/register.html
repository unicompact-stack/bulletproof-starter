<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Sociora</title>
<meta name="description" content="Регистрация в Sociora: 7 дней бесплатно, 15 постов в подарок, без привязки карты.">
<meta name="theme-color" content="#0a0a13">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<div class="bg-glows"></div>
<div class="auth-page">
  <div class="auth-box">
    <a class="back" href="/">← На главную</a>
    <div class="panel">
      <a class="logo" href="/" style="margin-bottom:22px"><span class="logo-mark">S</span>Sociora</a>
      <h1>Создать аккаунт</h1>
      <p class="sub">7 дней бесплатно · 15 постов в подарок · без привязки карты</p>
      <div class="form-error" id="error"></div>
      <form id="form-register">
        <div class="field">
          <label for="name">Имя</label>
          <input id="name" name="name" placeholder="Как к вам обращаться" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.ru" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" placeholder="Минимум 6 символов" autocomplete="new-password" minlength="6" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="btn-submit">Зарегистрироваться</button>
      </form>
      <div class="auth-switch">Уже есть аккаунт? <a href="/login">Войти</a></div>
    </div>
  </div>
</div>
<script>
(function () {
  var form = document.getElementById("form-register");
  var error = document.getElementById("error");
  var btn = document.getElementById("btn-submit");

  function showError(msg) {
    error.textContent = msg;
    error.classList.add("show");
  }

  // если уже авторизован — ведём в кабинет
  fetch("/api/me", { credentials: "same-origin" })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.ok) location.replace("/app"); })
    .catch(function () {});

  form.onsubmit = function (e) {
    e.preventDefault();
    error.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Создаём аккаунт…";
    fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
      .then(function (res) {
        if (res.data.ok) {
          // сохраняем токен: cookie может не дойти, поэтому дублируем в hash
          try { localStorage.setItem("sociora_token", res.data.token); } catch (e) {}
          location.href = "/app/?token=" + encodeURIComponent(res.data.token);
        } else {
          showError(res.data.error || "Не удалось зарегистрироваться");
          btn.disabled = false;
          btn.textContent = "Зарегистрироваться";
        }
      })
      .catch(function () {
        showError("Сервер недоступен. Проверьте, что запущен server.py");
        btn.disabled = false;
        btn.textContent = "Зарегистрироваться";
      });
  };
})();
</script>
</body>
</html>
