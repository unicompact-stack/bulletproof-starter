<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пульт ведущего — ЗалСвет</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn side-toggle" id="sideToggle" type="button" aria-label="Разделы">☰</button>
      <a class="brand" href="/">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#12101a"/>
          <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#e8c27a" stroke-width="1.5"/>
          <path d="M18 44 L32 16 L46 44" fill="none" stroke="#8b5cf6" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M23 44h18" stroke="#e8c27a" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span><b>ЗалСвет</b><small>СЦЕНА</small></span>
      </a>
      <nav class="top-nav" id="topNav"></nav>
      <div class="top-actions" id="topActions"></div>
    </header>
    <aside class="side" id="side">
      <button class="holidays-card" id="openHolidays" type="button"><i>＋</i><span>Праздники<br>карточки и календарь</span></button>
      <div class="clock-block">
        <strong id="clock">--:--</strong>
        <div><span class="dot">●</span> <span id="dateLine"></span></div>
        <div id="showLine" class="show-line">Свадьба Анны и Марка</div>
      </div>
      <div class="search-row">
        <input id="search" placeholder="Найти раздел" aria-label="Поиск раздела">
        <button class="gear" id="openSets" type="button" aria-label="Наборы">⚙</button>
      </div>
      <div class="sec-head">ВЕЧЕР <button class="linkish" id="addSet" type="button">+ набор</button></div>
      <div class="sections" id="sections"></div>
    </aside>
    <main class="stage-col">
      <div class="stage-wrap">
        <div class="stage-frame" id="stageFrame">
          <div class="zoom">
            <button type="button" id="zoomOut" aria-label="Уменьшить">−</button>
            <span id="zoomLabel">100%</span>
            <button type="button" id="zoomIn" aria-label="Увеличить">+</button>
          </div>
          <iframe id="screen" title="Экран для гостей"></iframe>
        </div>
      </div>
      <div class="dock" id="dock"></div>
      <footer class="stage-foot">
        <button class="save-btn" id="saveScene" type="button">Сохранить</button>
        <span class="live-pill" id="liveLine">На экране</span>
        <span class="demo-pill" id="demoPill">Демо</span>
      </footer>
    </main>
  </div>
  <div class="popover" id="popover" hidden></div>
  <div class="modal-back" id="modalBack" hidden><div class="modal" id="modal"></div></div>
  <div class="tour" id="tour" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script src="/js/console.js"></script>
</body>
</html>
